# ─── Random base-model config ────────────────────────────────────────────────────
# Matches RecBole's own config format exactly.
# Run with: python run_recbole.py --config_files configs/Random/ml-100k.yaml

model: Random
dataset: ml-100k
data_path: dataset/

# Training
#

# Evaluation
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  group_by: user
  order: RO
  mode: full
metrics: [Recall, MRR, NDCG, Hit, Precision]
topk: [10]
valid_metric: MRR@10
